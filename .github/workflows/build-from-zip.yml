name: Build Flutter APK from ZIP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean old extracted folder
        run: |
          rm -rf arisan_wk_app

      - name: Verify ZIP exists
        run: |
          test -f arisan_wk_app_mvp.zip
          ls -lah arisan_wk_app_mvp.zip

      - name: Unzip Flutter project
        run: |
          unzip -o arisan_wk_app_mvp.zip
          ls -la
          ls -la arisan_wk_app

      - name: Verify project files
        run: |
          test -f arisan_wk_app/pubspec.yaml
          test -f arisan_wk_app/lib/main.dart
          test -f arisan_wk_app/android/app/src/main/kotlin/com/example/arisan_wk_app/MainActivity.kt

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: arisan_wk_app
        run: |
          set -e
          mkdir -p /tmp/arisan-wk-native
          cp android/app/src/main/kotlin/com/example/arisan_wk_app/MainActivity.kt /tmp/arisan-wk-native/MainActivity.kt
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/arisan-wk-native/AndroidManifest.xml
          fi
          flutter create . --platforms=android --project-name arisan_wk_app --org com.example
          rm -rf test
          mkdir -p android/app/src/main/kotlin/com/example/arisan_wk_app
          cp /tmp/arisan-wk-native/MainActivity.kt android/app/src/main/kotlin/com/example/arisan_wk_app/MainActivity.kt
          if [ -f /tmp/arisan-wk-native/AndroidManifest.xml ]; then
            cp /tmp/arisan-wk-native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          grep -q "readLatestBackupFromDownloads" android/app/src/main/kotlin/com/example/arisan_wk_app/MainActivity.kt

      - name: Install dependencies
        working-directory: arisan_wk_app
        run: flutter pub get

      - name: Analyze project
        working-directory: arisan_wk_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK
        working-directory: arisan_wk_app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arisan-WK-APK
          path: arisan_wk_app/build/app/outputs/flutter-apk/app-debug.apk
